<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignment Submission Portal (Demo)</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 12px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 20px; }
    #msg { margin-top: 10px; padding: 8px; display: none; }
    .err { background: #fdecea; color: #b71c1c; }
    .ok { background: #e8f5e9; color: #1b5e20; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #999; padding: 6px; text-align: left; }
  </style>
</head>
<body>
  <h1>Assignment Submission Portal <small>(static demo)</small></h1>
  <form id="f">
    <label>Name</label><input id="name">
    <label>Registration Number</label><input id="reg">
    <label>Assignment Title</label><input id="title">
    <label>Submission URL</label><input id="url">
    <button type="submit">Submit</button>
  </form>
  <div id="msg"></div>
  <h2>Saved Submissions (this browser only)</h2>
  <table><thead><tr><th>Name</th><th>Reg. No</th><th>Assignment</th><th>URL</th></tr></thead>
  <tbody id="rows"></tbody></table>
  <script>
    const rows = document.getElementById("rows"), msg = document.getElementById("msg");
    const show = (t, ok) => { msg.textContent = t; msg.className = ok ? "ok" : "err"; msg.style.display = "block"; };
    document.getElementById("f").addEventListener("submit", e => {
      e.preventDefault();
      const v = id => document.getElementById(id).value.trim();
      const [name, reg, title, url] = [v("name"), v("reg"), v("title"), v("url")];
      if (!name || !reg || !title || !url) return show("All fields are required.", false);
      try { if (!/^https?:$/.test(new URL(url).protocol)) throw 0; }
      catch { return show("Submission URL is not a valid http(s) URL.", false); }
      const tr = document.createElement("tr");
      [name, reg, title, url].forEach(x => { const td = document.createElement("td"); td.textContent = x; tr.appendChild(td); });
      rows.appendChild(tr);
      show("Submission saved.", true);
      e.target.reset();
    });
  </script>
</body>
</html>
