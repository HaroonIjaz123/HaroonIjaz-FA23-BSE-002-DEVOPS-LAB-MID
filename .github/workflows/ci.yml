name: CI

on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run JavaScript tests
        run: npm test > test-output.txt
      - name: Build React application
        run: npm run build
      - name: Keep test output for report job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-output
          path: test-output.txt

  report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ci-test-output
      - name: Build detailed test report
        run: npm run build-report
      - name: Send report to ngrok receiver
        run: npm run send-report
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
      - name: Email the report (bonus)
        if: always() && hashFiles('test-report.json') != ''
        run: npm run send-email
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || 'harooonijaz123@gmail.com' }}
      - name: Keep the report as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.json

  deploy:
    needs: test                       # runs only if the test job succeeded
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
